[audio]
enable_overdrive = true

[bar]
order = [ "main" ]

    [bar.default]
    background_opacity = 0.7
    center = [ "clock" ]
    enabled = true
    end = [ "tailscale", "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "notifications", "session" ]
    font_family = "Adwaita Sans"
    font_scale = 1.0
    font_weight = 500
    hover_highlight = true
    layer = "top"
    margin_edge = 0
    margin_ends = 0
    padding = 14
    position = "top"
    radius = 0
    reserve_space = true
    scale = 1.0
    shadow = true
    thickness = 34
    widget_spacing = 14

[battery]
warning_threshold = 15

[control_center]
width = 760

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
pre_action_fade_seconds = 0

[lockscreen]
lock_before_suspend = false
transition = []

[lockscreen_widgets]
enabled = false
schema_version = 2

[shell]
polkit_agent = true
time_format = "{:%Y-%m-%d}"

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center_right"
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "~/Pictures/screenshots"

    [shell.session]
    grid = true
    grid_columns = 1

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    enable_community_templates = false

[weather]
unit = "imperial"

[plugins]
enabled = [ "davemhammer/tailscale" ]

[plugin_settings."davemhammer/tailscale"]
notify_on_peer_change = false

[widget.tailscale]
type = "davemhammer/tailscale:status"

[widget.clock]
format = "{:%-d %b | %-I:%M:%S %p}"

# No OSD popup every time a new song or video starts
[osd.kinds]
media = false
