[audio]
enable_overdrive = true

[bar]
order = [ "main" ]

    [bar.default]
    background_opacity = 0.7
    center = [ "clock" ]
    enabled = true
    end = [ "tailscale", "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "notifications", "session" ]
    font_family = "Adwaita Sans"
    font_scale = 1.0
    font_weight = 500
    hover_highlight = true
    layer = "top"
    margin_edge = 0
    margin_ends = 0
    padding = 14
    position = "top"
    radius = 0
    reserve_space = true
    scale = 1.0
    shadow = true
    thickness = 34
    widget_spacing = 14

[battery]
warning_threshold = 15

[control_center]
width = 760

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
pre_action_fade_seconds = 0

[lockscreen]
transition = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true
time_format = "{:%Y-%m-%d}"

    [shell.launcher]
    categories = false
    compact = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center_right"
    transparency_mode = "glass"

    [shell.session]
    grid = true
    grid_columns = 1

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    enable_community_templates = false

[weather]
unit = "imperial"

[plugins]
enabled = [ "davemhammer/tailscale" ]

[plugin_settings."davemhammer/tailscale"]
notify_on_peer_change = false

[widget.tailscale]
type = "davemhammer/tailscale:status"

[widget.clock]
format = "{:%-I:%M:%S %p}"

# No OSD popup every time a new song or video starts
[osd.kinds]
media = false
